name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    permissions:
      contents: read
    # actionlint 1.7.12 rejects the "$/" self-repository syntax. A job-level
    # reusable workflow loads from the same commit, not from a runner checkout.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  build:
    name: build
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.17
          add_shims_to_path: false
          install: true
          cache: false

      - name: Check that the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match v$version from package.json."
            exit 1
          fi
          echo "Tag $TAG matches package.json version $version."

      - run: bun install --frozen-lockfile

      - run: bun scripts/release.ts

      - name: Check the release archives
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/release/github/*.tar.gz)
          if [ "${#archives[@]}" -ne 6 ]; then
            echo "::error::Expected 6 archives in dist/release/github, found ${#archives[@]}."
            exit 1
          fi
          if [ ! -f dist/release/github/SHA256SUMS ]; then
            echo "::error::dist/release/github/SHA256SUMS is missing."
            exit 1
          fi
          cd dist/release/github
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/release/npm
            dist/release/github
          if-no-files-found: error
          retention-days: 7

  npm:
    name: npm
    needs: build
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release

      - name: Check the npm packages
        run: |
          set -euo pipefail
          for pkg in oh-my-t3 oh-my-t3code omt3; do
            if [ ! -f "dist/release/npm/$pkg/package.json" ]; then
              echo "::error::dist/release/npm/$pkg/package.json is missing."
              exit 1
            fi
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false

      - name: Install the pinned npm release
        run: |
          npm install --global npm@11.21.1
          test "$(npm --version)" = "11.21.1"

      - name: Publish the npm packages
        run: |
          set -uo pipefail
          set +e
          root="$PWD"
          failed=()
          published=()
          for pkg in oh-my-t3 oh-my-t3code omt3; do
            dir="$root/dist/release/npm/$pkg"
            if ! version="$(node -p 'require(process.argv[1]).version' "$dir/package.json")"; then
              echo "::error::Cannot read the version of $pkg."
              failed+=("$pkg")
              continue
            fi
            # Run outside the package folder so npm view reads the registry, not the local package.
            out="$(cd "$RUNNER_TEMP" && npm view "$pkg@$version" version 2>&1)"
            code=$?
            if [ "$code" -eq 0 ] && [ "$out" = "$version" ]; then
              echo "$pkg@$version is already published; skip."
              continue
            fi
            if [ "$code" -ne 1 ] || ! grep -q E404 <<<"$out"; then
              echo "$out"
              echo "::error::npm view $pkg@$version exited with $code and an unexpected output."
              failed+=("$pkg")
              continue
            fi
            echo "$pkg@$version is not published; publish it."
            if (cd "$dir" && npm publish --access public --tag latest); then
              published+=("$pkg@$version")
            else
              echo "::error::npm publish failed for $pkg@$version."
              failed+=("$pkg")
            fi
          done
          {
            echo "## npm"
            echo
            if [ "${#failed[@]}" -gt 0 ]; then
              echo "These packages failed: ${failed[*]}. Read the job log, fix the cause, and re-run the job."
              echo
            fi
            echo "Published: ${published[*]:-none}."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#failed[@]}" -gt 0 ]; then
            exit 1
          fi

  github:
    name: github
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release

      - name: Create the GitHub release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          set +e
          shopt -s nullglob
          expected=()
          for file in dist/release/github/*.tar.gz; do
            expected+=("$(basename "$file")")
          done
          expected+=(SHA256SUMS)
          if [ "${#expected[@]}" -ne 7 ] || [ ! -f dist/release/github/SHA256SUMS ]; then
            echo "::error::Expected 6 archives and SHA256SUMS in dist/release/github."
            exit 1
          fi
          err="$(mktemp)"
          view="$(gh release view "$TAG" --json isDraft,assets 2>"$err")"
          code=$?
          if [ "$code" -ne 0 ]; then
            if grep -q "release not found" "$err"; then
              set -e
              gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes dist/release/github/*
              exit 0
            fi
            cat "$err"
            echo "::error::gh release view $TAG exited with $code."
            exit 1
          fi
          if ! is_draft="$(jq -r .isDraft <<<"$view")" || ! names="$(jq -r '.assets[].name' <<<"$view")"; then
            echo "::error::Cannot read the state of release $TAG."
            exit 1
          fi
          missing=()
          for name in "${expected[@]}"; do
            if ! grep -qxF "$name" <<<"$names"; then
              missing+=("$name")
            fi
          done
          if [ "$is_draft" = "false" ] && [ "${#missing[@]}" -eq 0 ]; then
            echo "Release $TAG exists with all 7 assets; skip."
            exit 0
          fi
          echo "::error::Release $TAG exists but is incomplete. Draft: $is_draft. Missing assets: ${missing[*]:-none}."
          echo "To recover, upload the missing files and publish the release:"
          echo "  gh release upload \"$TAG\" <files> --clobber"
          echo "  gh release edit \"$TAG\" --draft=false"
          echo "Or delete the draft release and re-run this job."
          exit 1
